<!doctype html><html><head><meta charset="utf-8"><title>Requirement needs correction · ContractIQ</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="page-shell"><p><a href="/bids/{{ entered.bid_id }}/requirements-scope">← Back to Bid Requirements and scope</a></p><h1>Customer requirement needs correction</h1><section class="card" role="alert"><strong>No requirement or audit was created.</strong> {{ error }}</section><section class="card"><p>All entered values are retained below. Explicit requirements require an exact controlled version and source locator. <a href="/documents?bid_id={{ entered.bid_id }}#register-form">Register a customer source</a>.</p><form method="post" action="/requirements"><input type="hidden" name="bid_id" value="{{ entered.bid_id }}"><div class="form-grid"><label>Origin<select name="origin">{% for item in origins %}<option value="{{ item.value }}"{% if entered.origin == item.value %} selected{% endif %}>{{ item.value }}</option>{% endfor %}</select></label><label>Category<select name="category">{% for item in categories %}<option value="{{ item.value }}"{% if entered.category == item.value %} selected{% endif %}>{{ item.value }}</option>{% endfor %}</select></label><label>Significance<select name="significance">{% for item in significances %}<option value="{{ item.value }}"{% if entered.significance == item.value %} selected{% endif %}>{{ item.value }}</option>{% endfor %}</select></label><label>Lifecycle stage<select name="lifecycle_stage">{% for item in stages %}<option value="{{ item.value }}"{% if entered.lifecycle_stage == item.value %} selected{% endif %}>{{ item.value }}</option>{% endfor %}</select></label><label>Title<input name="title" value="{{ entered.title or '' }}" required></label><label class="wide">Customer Requirement Statement (original wording)<textarea name="statement" required>{{ entered.statement or '' }}</textarea></label><label class="wide">Our Proposed Bid Response<textarea name="response_text">{{ entered.response_text or '' }}</textarea></label><label>Disposition<select name="disposition">{% for item in dispositions %}<option value="{{ item.value }}"{% if entered.disposition == item.value %} selected{% endif %}>{{ item.value }}</option>{% endfor %}</select></label><input type="hidden" name="work_state" value="{{ entered.work_state or 'OPEN' }}"><label>Accountable owner<input name="owner" value="{{ entered.owner or '' }}"></label><label>Primary internal contributor<input name="contributor" value="{{ entered.contributor or '' }}"></label><label>Response reviewer<input name="reviewer" value="{{ entered.reviewer or '' }}"></label><label>Due date<input type="date" name="due_date" value="{{ entered.due_date or '' }}"></label><label>Controlled version<select name="source_document_version_id"><option value="">Choose exact version</option>{% if sources %}{% for item in sources.available %}<option value="{{ item.document_version_id }}"{% if entered.source_document_version_id == item.document_version_id %} selected{% endif %}>{{ item.document_title }} · {{ item.version_label }}</option>{% endfor %}{% endif %}</select></label><label>Clause / section<input name="source_clause" value="{{ entered.source_clause or '' }}"></label><label>Locator note<input name="source_locator_note" value="{{ entered.source_locator_note or '' }}"></label><label>Page<input type="number" min="1" name="source_page_start" value="{{ entered.source_page_start or '' }}"></label><label class="wide">Source excerpt<textarea name="source_excerpt">{{ entered.source_excerpt or '' }}</textarea></label></div><button>Create authoritative requirement and response</button></form></section></main></body></html>

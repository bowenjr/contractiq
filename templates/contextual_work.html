<!doctype html><html><head><meta charset="utf-8"><title>Create linked My Work · ContractIQ</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="page-shell"><p><a href="/bids/{{ bid_id }}">← Back to Bid {{ bid_id }}</a></p><h1>Create linked My Work action</h1><p><strong>{{ source_kind|replace('_',' ')|title }}:</strong> {{ source_label }}</p><p>The source remains authoritative; My Work carries the action and follow-up lifecycle.</p>{% if error %}<section class="card" role="alert"><strong>No work item or link was created.</strong> {{ error }} Values retained.</section>{% endif %}<section class="card"><form method="post" action="/work/from/{{ source_kind }}/{{ source_id }}"><label>Action title<input name="title" required value="{{ entered.title or '' }}"></label><label>Purpose<input name="purpose" required value="{{ entered.purpose or 'Closure follow-up' }}"></label><label>Work category<select name="category">{% for item in categories %}<option value="{{ item.value }}"{% if entered.category == item.value %} selected{% endif %}>{{ item.value|replace('_',' ')|title }}</option>{% endfor %}</select></label><label>Next-action date<input type="date" name="next_action_date" value="{{ entered.next_action_date or '' }}"></label><button>Create and link action</button></form></section></main></body></html>

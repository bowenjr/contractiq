<!doctype html><html><head><meta charset="utf-8"><title>History · ContractIQ</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="page-shell"><p><a href="/deliverables/{{ deliverable_id }}">← Deliverable</a></p><h1>Deliverable history</h1><section class="card"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>{% for row in history %}<tr><td>{{ row.timestamp }}</td><td>{{ row.actor }}</td><td>{{ row.action }}</td><td>{{ row.detail }}</td></tr>{% else %}<tr><td colspan="4">No history.</td></tr>{% endfor %}</tbody></table></section></main></body></html>

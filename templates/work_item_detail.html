<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Edit {{ item.title }} — ContractIQ</title>
<style>body{font:15px system-ui;margin:0;background:#f4f1eb;color:#1a1f2e}main{max-width:960px;margin:auto;padding:32px}.back{color:#175cd3}.panel{background:#fff;border:1px solid #d4cfc6;border-radius:8px;padding:24px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field label{font-weight:650}.field input,.field select,.field textarea{font:inherit;padding:9px;border:1px solid #9ca3af;border-radius:5px}.field textarea{min-height:90px}.lifecycle{border:1px solid #d4cfc6;border-radius:6px;padding:14px}.lifecycle legend{font-weight:700}.error{padding:10px;margin-bottom:16px;background:#fee2e2;color:#991b1b;border-radius:5px}.actions{display:flex;gap:12px;margin-top:20px}.btn{font:inherit;padding:9px 14px;border:1px solid #175cd3;border-radius:5px;background:#175cd3;color:white}.muted{color:#6b7280}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><main><a class="back" href="{{ back_href }}">← Back to My Work</a><h1>Edit work item</h1><p class="muted">{{ item.work_item_id }} · Version {{ item.version }}</p>
<section class="panel">{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/my-work/{{ item.work_item_id }}{% if editor_query %}?{{ editor_query }}{% endif %}"><input type="hidden" name="expected_version" value="{{ item.version }}"><div class="grid">
<div class="field full"><label for="title">Title</label><input id="title" name="title" required maxlength="300" value="{{ values.title or '' }}"></div>
<div class="field full"><label for="details">Description</label><textarea id="details" name="details" maxlength="10000">{{ values.details or '' }}</textarea></div>
<div class="field"><label for="category">Work category</label><select id="category" name="category">{% for option in categories %}<option value="{{ option.value }}"{% if values.category == option.value %} selected{% endif %}>{{ category_labels[option] }}</option>{% endfor %}</select></div>
<div class="field"><label for="domain">Responsibility domain</label><select id="domain" name="responsibility_domain"><option value="">Domain unassigned</option>{% for option in domains %}<option value="{{ option.value }}"{% if values.responsibility_domain == option.value %} selected{% endif %}>{{ domain_labels[option] }}</option>{% endfor %}</select></div>
<div class="field"><label for="status">Status</label><select id="status" name="status">{% for option in statuses %}<option value="{{ option.value }}"{% if values.status == option.value %} selected{% endif %}>{{ status_labels[option] }}</option>{% endfor %}</select></div>
<div class="field"><label for="priority">Priority</label><select id="priority" name="priority">{% for option in priorities %}<option value="{{ option.value }}"{% if values.priority == option.value %} selected{% endif %}>{{ option.value|title }}</option>{% endfor %}</select></div>
<div class="field"><label for="context">Business context (optional)</label><select id="context" name="bid_id"><option value="">No bid / contract context</option>{% for bid in bids %}<option value="{{ bid.bid_id }}"{% if values.bid_id == bid.bid_id %} selected{% endif %}>{{ bid.bid_id }} · {{ bid.project_name }}</option>{% endfor %}</select></div>
<div class="field"><label for="due">Due date</label><input id="due" name="due_date" type="date" value="{{ values.due_date or '' }}"></div>
<div class="field"><label for="next-action">Next-action date</label><input id="next-action" name="next_action_date" type="date" value="{{ values.next_action_date or '' }}"></div>
<fieldset class="lifecycle full" data-status-section="WAITING"{% if values.status != 'WAITING' %} hidden disabled{% endif %}><legend>Waiting details</legend><div class="grid">
<div class="field"><label for="waiting-kind">Waiting party type</label><select id="waiting-kind" name="waiting_party_kind"><option value="">Select when waiting</option>{% for option in waiting_kinds %}<option value="{{ option.value }}"{% if values.waiting_party_kind == option.value %} selected{% endif %}>{{ waiting_kind_labels[option] }}</option>{% endfor %}</select></div>
<div class="field"><label for="waiting-party">Waiting party</label><input id="waiting-party" name="waiting_party_label" value="{{ values.waiting_party_label or '' }}" required></div>
<div class="field full"><label for="waiting-owed">Expected response or deliverables</label><textarea id="waiting-owed" name="waiting_owed" required>{{ values.waiting_owed or '' }}</textarea></div>
<div class="field"><label for="requested-date">Requested date</label><input id="requested-date" name="requested_date" type="date" value="{{ values.requested_date or '' }}"></div>
<div class="field"><label for="chase-date">Follow-up/chase date</label><input id="chase-date" name="chase_date" type="date" value="{{ values.chase_date or '' }}" required></div>
</div></fieldset>
<fieldset class="lifecycle full" data-status-section="BLOCKED"{% if values.status != 'BLOCKED' %} hidden disabled{% endif %}><legend>Blocked details</legend><div class="grid">
<div class="field full"><label for="blocker">Blocker description</label><textarea id="blocker" name="blocker_description" required>{{ values.blocker_description or '' }}</textarea></div>
<div class="field"><label for="resolution-owner">Resolution owner</label><input id="resolution-owner" name="resolution_owner" value="{{ values.resolution_owner or '' }}" required></div>
<div class="field"><label for="review-date">Blocker review date</label><input id="review-date" name="review_date" type="date" value="{{ values.review_date or '' }}"></div>
</div></fieldset>
<fieldset class="lifecycle full" data-status-section="COMPLETED"{% if values.status != 'COMPLETED' %} hidden disabled{% endif %}><legend>Completion details</legend><div class="grid">
<div class="field full"><label for="outcome">Completion outcome</label><textarea id="outcome" name="completion_outcome" required>{{ values.completion_outcome or '' }}</textarea></div>
<div class="field full"><label for="evidence">Completion evidence (optional)</label><textarea id="evidence" name="completion_evidence">{{ values.completion_evidence or '' }}</textarea></div>
</div></fieldset>
<fieldset class="lifecycle full" data-status-section="CANCELLED"{% if values.status != 'CANCELLED' %} hidden disabled{% endif %}><legend>Cancellation details</legend><div class="grid">
<div class="field full"><label for="cancel-reason">Cancellation reason</label><textarea id="cancel-reason" name="cancellation_reason" required>{{ values.cancellation_reason or '' }}</textarea></div>
</div></fieldset>
<div class="field full"><input type="hidden" name="contribution_candidate" value="false"><label><input name="contribution_candidate" type="checkbox" value="true"{% if values.contribution_candidate in [true, 'true', 'on', '1', 1] %} checked{% endif %}> Contribution candidate</label></div>
</div><div class="actions"><button class="btn" type="submit">Save work item</button><a class="back" href="{{ back_href }}">Cancel and return</a></div></form></section></main>
<script>
const statusSelect = document.getElementById('status');
const lifecycleSections = document.querySelectorAll('[data-status-section]');
function syncLifecycleSections() {
  lifecycleSections.forEach((section) => {
    const active = section.dataset.statusSection === statusSelect.value;
    section.hidden = !active;
    section.disabled = !active;
  });
}
statusSelect.addEventListener('change', syncLifecycleSections);
syncLifecycleSections();
</script></body></html>
